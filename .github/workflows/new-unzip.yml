name: New Unzip

# Repo ke root mein rakhi ZIP ko khol kar purani project files/folders replace karta hai.
#  - ZIP ke andar files seedhi root par hon, ya ek upar wale folder ke andar: dono chalte hain.
#  - Pehle nayi ZIP check hoti hai (package.json + app.json). Kharab ZIP ho to purani files nahi hatti.
#  - .github (workflows) aur .git ko haath nahi lagata.
#  - Kaam ke baad ZIP delete ho jati hai, commit hota hai.
# Chalane ke do tareeqe: ZIP upload/push karein (khud chalta hai), ya Actions > New Unzip > Run workflow.
on:
  push:
    branches: [main]
    paths:
      - '*.zip'
  workflow_dispatch:
    inputs:
      zip_name:
        description: "ZIP ka naam (khali chhodein agar repo mein sirf ek ZIP hai)"
        required: false
        default: ""
      start_build:
        description: "Unzip ke baad android-apk.yml chalayen (agar maujood ho)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: new-unzip
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
      INPUT_ZIP: ${{ inputs.zip_name }}
      START_BUILD: ${{ inputs.start_build }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Find the ZIP
        run: |
          if [ -n "$INPUT_ZIP" ]; then
            ZIP="$INPUT_ZIP"
          else
            mapfile -t zips < <(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)
            if [ "${#zips[@]}" -eq 0 ]; then echo "ERROR: repo ke root mein koi .zip nahi mili"; exit 1; fi
            if [ "${#zips[@]}" -gt 1 ]; then echo "ERROR: ek se zyada ZIP hain (${zips[*]}). Run workflow mein zip_name likhein."; exit 1; fi
            ZIP="${zips[0]}"
          fi
          [ -f "./$ZIP" ] || { echo "ERROR: ./$ZIP nahi mili"; exit 1; }
          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"
          echo "Using ZIP: $ZIP"

      - name: Extract into a temporary folder and validate
        run: |
          STAGE="$RUNNER_TEMP/stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          unzip -q -o "./$ZIP_FILE" -d "$STAGE"
          rm -rf "$STAGE/__MACOSX"
          # agar sab kuch ek hi upar wale folder ke andar hai to us folder ko root maan lein
          SRC="$STAGE"
          if [ "$(find "$STAGE" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find "$STAGE" -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find "$STAGE" -mindepth 1 -maxdepth 1)"
            echo "ZIP ke andar ek upar wala folder tha, usi ko root liya: $(basename "$SRC")"
          fi
          for f in package.json app.json; do
            [ -f "$SRC/$f" ] || { echo "ERROR: ZIP mein $f nahi mili. Purani files nahi hatayi gayin."; exit 1; }
          done
          rm -rf "$SRC/.github" "$SRC/.git"
          echo "SRC_DIR=$SRC" >> "$GITHUB_ENV"
          echo "Nayi ZIP theek hai. Files:"; ls -A "$SRC"

      - name: Replace old project files with the new ones
        run: |
          # purani files/folders hatayen (.git, .github aur ZIP ko chhor kar)
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name "$ZIP_FILE" -exec rm -rf {} +
          # nayi files copy karein (hidden files samet)
          cp -a "$SRC_DIR"/. .
          # ZIP ko repo se hata dein
          rm -f "./$ZIP_FILE"
          test -f package.json && test -f app.json
          echo "Replace ho gaya. Ab root par:"; ls -A

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Koi tabdeeli nahi, commit ki zaroorat nahi"
          else
            git commit -m "Replace project from ZIP ($ZIP_FILE)"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Start the build (optional)
        run: |
          if [ "$START_BUILD" = "false" ]; then echo "Build skip (aap ne mana kiya)"; exit 0; fi
          if [ -f .github/workflows/android-apk.yml ]; then
            gh workflow run android-apk.yml --ref "$BRANCH"
            echo "android-apk.yml shuru ho gayi"
          else
            echo "NOTE: .github/workflows/android-apk.yml maujood nahi, build shuru nahi hui (unzip kamyab raha)"
          fi
