name: Build APK

# Sirf build ke liye. Project repo ke root mein hai (unzip ho chuka).
# Is file ko .github/workflows/build.yml par rakhein aur main.yml / unzip.yml delete kar dein,
# warna ek push par teen workflows chalti hain.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/unzip.yml'
      - '*.zip'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Verify APK (zip integrity + signature) and give it a clear name
        run: |
          set -e
          OUT=android/app/build/outputs/apk/release
          ls -l "$OUT"
          APK=$(ls "$OUT"/*.apk | head -n 1)
          unzip -tq "$APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "LicenseGenerator-v${{ github.run_number }}.apk"
          ls -l LicenseGenerator-v${{ github.run_number }}.apk
          sha256sum LicenseGenerator-v${{ github.run_number }}.apk | tee apk.sha256

      - name: Upload APK artifact (GitHub zips artifacts, unzip after download)
        uses: actions/upload-artifact@v4
        with:
          name: LicenseGenerator-apk
          path: |
            LicenseGenerator-v${{ github.run_number }}.apk
            apk.sha256

      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: License Generator APK #${{ github.run_number }}
          body_path: apk.sha256
          files: LicenseGenerator-v${{ github.run_number }}.apk
          fail_on_unmatched_files: true
