name: Build APK and EXE

# Sirf build ke liye. Project repo ke root mein hai (unzip ho chuka).
# Is file ko .github/workflows/build.yml par rakhein aur main.yml / unzip.yml delete kar dein,
# warna ek push par teen workflows chalti hain.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/unzip.yml'
      - '*.zip'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LicenseGenerator-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: License Generator APK #${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk

  exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Export web build
        run: npx expo export --platform web
        env:
          CI: "1"

      - name: Build Windows EXE
        run: npx electron-builder --win --config electron/builder.json --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LicenseGenerator-exe
          path: release/*.exe

      - name: Publish EXE as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-${{ github.run_number }}
          name: License Generator EXE #${{ github.run_number }}
          files: release/*.exe
